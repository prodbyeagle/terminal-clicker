[package]
name = "terminal-clicker"
version = "0.1.0"
edition = "2024"

[dependencies]
# API ändert sich noch oft – exakt festpinnen (siehe Cargo.lock)
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.dev.package."*"]
opt-level = 2

# Für das Verschieben des Fensters über die eigene Titelleiste (AppKit).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

[lints.rust]
# Die `objc`-0.2-Makros fragen intern `feature = "cargo-clippy"` ab.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
